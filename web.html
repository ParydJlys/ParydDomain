<!DOCTYPE html>
<html lang="id" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Akademik Paryds | Jasjok Makalah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://store-images.s-microsoft.com/image/apps.34728.13998740598365436.a16ce03d-47d8-4d4e-a764-076be7077725.9d74ad50-e238-4681-a2f8-c6e3fdd088a3?h=210">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-main: #0b0f1a; --bg-side: #0f172a; --text: #e2e8f0; --glass: rgba(30, 41, 59, 0.7); }
        .light-mode { --bg-main: #f1f5f9; --bg-side: #ffffff; --text: #1e293b; --glass: rgba(255, 255, 255, 0.8); }
        body { background-color: var(--bg-main); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); transition: all 0.3s; overflow: hidden; }
        .glass-effect { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-right: 1px solid rgba(168, 85, 247, 0.2); }
        .active-chat { background: rgba(147, 51, 234, 0.3); border-left: 4px solid #d946ef; }
        .chat-bubble-user { background: linear-gradient(to right, #9333ea, #db2777); color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: var(--bg-side); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 20px 20px 20px 4px; position: relative; }
        .typing-dot { width: 6px; height: 6px; background: #d946ef; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .online-indicator { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; position: relative; }
        .online-indicator::after { content: ''; position: absolute; width: 100%; height: 100%; background: inherit; border-radius: inherit; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { #sidebar { position: fixed; height: 100%; transform: translateX(-100%); } #sidebar.open { transform: translateX(0); } }
        .rating-star { cursor: pointer; transition: color 0.2s; }
        .rating-star:hover, .rating-star.active { color: #facc15; }
    </style>
</head>
<body class="h-screen flex">
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 hidden z-40"></div>

    <aside id="sidebar" class="w-72 glass-effect flex flex-col shrink-0">
        <div class="p-4 border-b border-white/10 flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500">Jasa Joki Paryd</h1>
            <button onclick="toggleMenu()" title="Tutup Menu" aria-label="Tutup Menu" class="md:hidden text-white"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-4">
            <button onclick="createNewChat(); if(window.innerWidth < 768) toggleMenu();" title="Buat Percakapan Baru" aria-label="Buat Percakapan Baru" class="w-full py-2.5 px-4 rounded-xl border border-dashed border-purple-500/50 hover:bg-purple-500/10 transition-all flex items-center justify-center gap-3 text-sm font-semibold text-white">
                <i class="fas fa-plus"></i> Chat Baru
            </button>
        </div>

        <div class="px-4 py-2 space-y-3 overflow-y-auto">
            <p class="text-[10px] uppercase tracking-[0.2em] text-pink-500 font-black px-1 opacity-80">Kalkulator Order</p>
            <div class="space-y-2">
                <label class="flex items-center justify-between bg-slate-800/40 border border-white/5 p-3 rounded-xl cursor-pointer hover:border-pink-500/50 transition-all">
                    <span class="text-[11px] text-gray-300">Revisi (10k)</span>
                    <input type="checkbox" title="Pilih Jasa Revisi" value="10000" class="price-checkbox w-4 h-4 accent-pink-500" onchange="updateTotal()">
                </label>
                <label class="flex items-center justify-between bg-slate-800/40 border border-white/5 p-3 rounded-xl cursor-pointer hover:border-purple-500/50 transition-all">
                    <span class="text-[11px] text-gray-300">Makalah (15k)</span>
                    <input type="checkbox" title="Pilih Jasa Makalah" value="15000" class="price-checkbox w-4 h-4 accent-purple-500" onchange="updateTotal()">
                </label>
            </div>
            <div class="bg-purple-900/20 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                <span class="text-xs font-bold">Total:</span>
                <span id="display-total" class="text-sm font-black text-pink-400">Rp 0</span>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="history-list"></div>

        <div class="p-4 border-t border-white/10 space-y-3">
            <button onclick="orderWA()" title="Hubungi Admin WhatsApp" aria-label="Hubungi Admin WhatsApp" class="flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white text-xs font-bold rounded-xl shadow-lg hover:scale-[1.02] transition-transform">
                <i class="fab fa-whatsapp text-lg"></i> Order Sekarang
            </button>
            <div onclick="toggleSettings()" class="flex items-center justify-between text-sm text-gray-400 hover:text-white cursor-pointer transition-colors pt-2">
                <div class="flex items-center gap-3"><i class="fas fa-cog text-xs"></i><span>Setelan & Bantuan</span></div>
                <div class="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#0b0f1a]" id="main-content">
        <header class="p-4 glass-effect border-b border-purple-500/20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" title="Buka Menu Sidebar" aria-label="Buka Menu Sidebar" class="md:hidden w-10 h-10 flex items-center justify-center bg-slate-800 rounded-lg text-purple-400">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/20"><i class="fas fa-robot text-white"></i></div>
                        <div class="online-indicator absolute bottom-0 right-0 border-2 border-[#0b0f1a]"></div>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm leading-tight" id="chat-title">AI Paryds</h2>
                        <span class="text-[10px] text-green-400 font-medium">Online</span>
                    </div>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6"></div>

        <div class="p-4 bg-slate-900/80 border-t border-white/5">
            <div class="max-w-3xl mx-auto flex items-center gap-2">
                <button onclick="document.getElementById('file-input').click()" title="Lampirkan Gambar" aria-label="Lampirkan Gambar" class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 hover:bg-slate-700 text-purple-400 rounded-xl flex items-center justify-center shrink-0 border border-white/5 transition-colors">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewImage(this)" title="Pilih file gambar">
                <input type="text" id="user-input" placeholder="Tanya soal makalah kamu, jangan sungkan.." title="Masukkan pesan kamu di sini" class="flex-1 bg-slate-800 border border-purple-500/30 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all">
                <button onclick="handleChat()" title="Kirim Pesan Sekarang" aria-label="Kirim Pesan Sekarang" class="bg-pink-600 hover:bg-pink-500 text-white w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center shrink-0 shadow-lg transition-all active:scale-95"><i class="fas fa-paper-plane"></i></button>
            </div>
            <p class="text-[10px] text-center text-gray-600 mt-2">© 2026 Ahmad Farid Ridho | Developer Mahasiswa</p>
        </div>
    </main>

    <div id="modal-settings" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-purple-500/30 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl">
            <div class="flex border-b border-white/10">
                <button onclick="switchTab('pengaturan')" id="tab-pengaturan" title="Tab Pengaturan" class="flex-1 py-4 text-sm font-bold text-pink-500 border-b-2 border-pink-500 bg-white/5">Pengaturan</button>
                <button onclick="switchTab('bantuan')" id="tab-bantuan" title="Tab Bantuan" class="flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white">Bantuan & Rating</button>
            </div>
            <div id="content-pengaturan" class="p-6 space-y-4">
                <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                    <p class="text-xs text-pink-400 font-bold mb-2 uppercase tracking-widest">Deskripsi Layanan</p>
                    <p class="text-[11px] text-gray-400 leading-relaxed">AI Paryds: Solusi cerdas bantu susun makalah dan laporan praktikum secara profesional dan terstruktur.</p>
                </div>
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/5">
                    <span class="text-sm font-medium">Mode Gelap</span>
                    <button onclick="toggleTheme()" id="theme-btn" title="Ganti Tema Tampilan" class="w-12 h-6 bg-purple-600 rounded-full relative transition-all">
                        <div id="theme-circle" class="w-4 h-4 bg-white rounded-full absolute top-1 right-1 transition-all"></div>
                    </button>
                </div>
                <button onclick="clearAllHistory()" title="Hapus Riwayat Chat" class="w-full py-3 bg-red-500/10 text-red-500 rounded-xl text-xs font-bold border border-red-500/20 hover:bg-red-500/20 transition-all">BERSIHKAN RIWAYAT</button>
            </div>
            <div id="content-bantuan" class="hidden p-6 space-y-4">
                <div class="p-4 bg-yellow-500/10 rounded-xl border border-yellow-500/20 text-center">
                    <p class="text-xs font-bold text-yellow-500 mb-2">Beri Bintang</p>
                    <div class="flex justify-center gap-2 text-2xl text-gray-600">
                        <i class="fas fa-star rating-star" onclick="setRating(1)" title="1 Bintang"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(2)" title="2 Bintang"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(3)" title="3 Bintang"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(4)" title="4 Bintang"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(5)" title="5 Bintang"></i>
                    </div>
                </div>
                <textarea id="complaint-text" placeholder="Tulis masukan Anda..." title="Kotak Keluhan" class="w-full h-24 bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
                <button onclick="sendComplaint()" title="Kirim Keluhan ke WA" class="w-full py-3 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-lg hover:bg-blue-500">KIRIM KE WA</button>
            </div>
            <div class="p-4 bg-black/20 flex justify-end border-t border-white/5">
                <button onclick="toggleSettings()" title="Tutup Modal" class="px-6 py-2 text-xs font-bold text-gray-400 hover:text-white">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        let currentChatId = Date.now().toString();
        let allChats = JSON.parse(localStorage.getItem('paryd_chats')) || {};
        let isDarkMode = true;
        let selectedImage = null;

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); }
        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function switchTab(t) {
            const isP = t === 'pengaturan';
            document.getElementById('content-pengaturan').classList.toggle('hidden', !isP);
            document.getElementById('content-bantuan').classList.toggle('hidden', isP);
            document.getElementById('tab-pengaturan').className = isP ? 'flex-1 py-4 text-sm font-bold text-pink-500 border-b-2 border-pink-500 bg-white/5' : 'flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white';
            document.getElementById('tab-bantuan').className = !isP ? 'flex-1 py-4 text-sm font-bold text-blue-500 border-b-2 border-blue-500 bg-white/5' : 'flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white';
        }
        function setRating(n) { document.querySelectorAll('.rating-star').forEach((s, i) => s.classList.toggle('active', i < n)); Swal.fire({ icon: 'success', title: 'Terima Kasih!', timer: 1000, showConfirmButton: false }); }
        function sendComplaint() { const t = document.getElementById('complaint-text').value; if(t) window.open(`https://wa.me/6289687783535?text=${encodeURIComponent(t)}`, '_blank'); }
        function updateTotal() { let t = 0; document.querySelectorAll('.price-checkbox:checked').forEach(c => t += parseInt(c.value)); document.getElementById('display-total').innerText = "Rp " + t.toLocaleString('id-ID'); }
        function orderWA() { window.open(`https://wa.me/6289687783535?text=Halo Paryds, mau order!`, '_blank'); }
        function previewImage(i) { if (i.files && i.files[0]) { const r = new FileReader(); r.onload = (e) => { selectedImage = e.target.result; Swal.fire({ title: 'Lampiran Siap', imageUrl: selectedImage, imageWidth: 100, showConfirmButton: false, timer: 800 }); }; r.readAsDataURL(i.files[0]); } }

        async function handleChat() {
            const text = document.getElementById('user-input').value.trim();
            if (!text && !selectedImage) return;

            // Logika baru untuk mengalihkan jasa penyusunan ke Farid
            const systemInstruction = `Kamu adalah AI Paryds, asisten akademik milik Farid. 
            Aturan main:
            1. Jika user minta dicarikan materi atau penjelasan, berikan isi materinya saja secara lengkap.
            2. Jika user minta 'susunkan makalah', 'buatkan file makalah', atau 'rapikan format', katakan kamu hanya AI yang bisa kasih materi mentah. 
            3. Untuk hasil makalah yang rapi dan siap kumpul, arahkan mereka untuk klik tombol 'Order Sekarang' atau hubungi WhatsApp Farid di 089687783535.`;

            if (!allChats[currentChatId]) {
                allChats[currentChatId] = { 
                    title: text.substring(0, 20) || "Chat Gambar", 
                    messages: [{ role: "system", content: systemInstruction }] 
                };
            }
            
            addMessage(text, 'user', selectedImage);
            allChats[currentChatId].messages.push({ role: "user", content: text, image: selectedImage });
            
            document.getElementById('user-input').value = "";
            selectedImage = null;
            showTyping(true);

            try {
                const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: allChats[currentChatId].messages.map(m => ({role: m.role, content: m.content})) 
                    })
                });
                const d = await r.json();
                const aiRes = d.choices[0].message.content;
                
                showTyping(false);
                allChats[currentChatId].messages.push({ role: "assistant", content: aiRes });
                addMessage(aiRes, 'ai'); 
                saveAndRender();
            } catch (e) { 
                showTyping(false); 
                console.error(e); 
            }
        }

        function showTyping(s) {
            const c = document.getElementById('chat-container');
            if (s) {
                const d = document.createElement('div'); d.id = 'typing-indicator'; d.className = 'flex flex-col items-start';
                d.innerHTML = `<div class="chat-bubble-ai p-3 flex gap-1 items-center"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
                c.appendChild(d);
            } else { const e = document.getElementById('typing-indicator'); if (e) e.remove(); }
            c.scrollTop = c.scrollHeight;
        }

        function addMessage(c, s, i = null) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `flex flex-col ${s === 'user' ? 'items-end' : 'items-start'}`;
            let imgH = i ? `<img src="${i}" class="max-w-[200px] rounded-xl mb-2 shadow-xl">` : '';
            let textH = c ? `<div>${s === 'ai' ? marked.parse(c) : c}</div>` : '';
            div.innerHTML = `<div class="max-w-[85%] p-4 text-sm ${s === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai prose prose-invert'}">${imgH}${textH}</div>`;
            container.appendChild(div); container.scrollTop = container.scrollHeight;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.getElementById('html-tag').classList.toggle('light-mode', !isDarkMode);
            document.getElementById('theme-circle').style.right = isDarkMode ? '4px' : '28px';
            document.getElementById('theme-btn').style.backgroundColor = isDarkMode ? '#9333ea' : '#cbd5e1';
            document.getElementById('main-content').style.backgroundColor = isDarkMode ? '#0b0f1a' : '#f1f5f9';
        }

        function saveAndRender() { localStorage.setItem('paryd_chats', JSON.stringify(allChats)); renderHistory(); }
        function renderHistory() {
            const l = document.getElementById('history-list'); l.innerHTML = '';
            Object.keys(allChats).sort().reverse().forEach(id => {
                const d = document.createElement('div');
                d.className = `group p-3 text-xs rounded-xl cursor-pointer flex items-center justify-between ${id === currentChatId ? 'active-chat' : 'hover:bg-white/5'}`;
                d.onclick = () => { loadChat(id); if(window.innerWidth < 768) toggleMenu(); };
                d.innerHTML = `<span class="truncate"><i class="far fa-comment-dots mr-2 text-pink-400"></i> ${allChats[id].title}</span>
                               <button onclick="deleteChat('${id}', event)" title="Hapus Chat" class="text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-trash-alt text-[10px]"></i></button>`;
                l.appendChild(d);
            });
        }

        function loadChat(id) { 
            currentChatId = id; 
            document.getElementById('chat-container').innerHTML = ''; 
            if (allChats[id]) {
                allChats[id].messages.filter(m => m.role !== 'system').forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'ai', m.image));
            }
            renderHistory(); 
        }
        function createNewChat() { currentChatId = Date.now().toString(); loadChat(currentChatId); }
        function deleteChat(id, e) { 
            e.stopPropagation(); 
            Swal.fire({
                title: 'Hapus chat?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, hapus!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    delete allChats[id]; 
                    saveAndRender(); 
                    if(currentChatId === id) createNewChat(); 
                }
            });
        }
        function clearAllHistory() { allChats = {}; localStorage.removeItem('paryd_chats'); createNewChat(); saveAndRender(); toggleSettings(); }
        
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key==='Enter') handleChat(); });
        window.onload = () => { 
            renderHistory(); 
            const lastId = Object.keys(allChats).sort().reverse()[0]; 
            lastId ? loadChat(lastId) : createNewChat(); 
        };
    </script>
</body>
</html>
