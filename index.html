<!DOCTYPE html>
<html lang="id" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Akademik Paryds | Jasjok Makalah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-main: #0b0f1a; --bg-side: #0f172a; --text: #e2e8f0; --glass: rgba(30, 41, 59, 0.7); }
        .light-mode { --bg-main: #f1f5f9; --bg-side: #ffffff; --text: #1e293b; --glass: rgba(255, 255, 255, 0.8); }
        body { background-color: var(--bg-main); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); transition: all 0.3s; overflow: hidden; }
        .glass-effect { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-right: 1px solid rgba(168, 85, 247, 0.2); }
        .active-chat { background: rgba(147, 51, 234, 0.3); border-left: 4px solid #d946ef; }
        .chat-bubble-user { background: linear-gradient(to right, #9333ea, #db2777); color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: var(--bg-side); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 20px 20px 20px 4px; }
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { #sidebar { position: fixed; height: 100%; transform: translateX(-100%); } #sidebar.open { transform: translateX(0); } }
        .rating-star { cursor: pointer; transition: color 0.2s; color: #475569; }
        .rating-star.active { color: #facc15; }
        .preview-container { position: absolute; bottom: 100%; left: 0; margin-bottom: 12px; display: none; }
    </style>
</head>
<body class="h-screen flex">
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 hidden z-40"></div>

    <aside id="sidebar" class="w-72 glass-effect flex flex-col shrink-0">
        <div class="p-4 border-b border-white/10 flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500">Jasa Joki Makalah Paryd</h1>
            <button onclick="toggleMenu()" class="md:hidden text-white"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-4">
            <button onclick="createNewChat()" class="w-full py-2.5 px-4 rounded-xl border border-dashed border-purple-500/50 hover:bg-purple-500/10 transition-all flex items-center justify-center gap-3 text-sm font-semibold text-white">
                <i class="fas fa-plus"></i> Chat Baru
            </button>
        </div>

        <div class="px-4 py-2 flex-1 overflow-y-auto space-y-3" id="history-list"></div>

        <div class="p-4 border-t border-white/10 space-y-3">
            <button onclick="orderWA()" class="flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white text-xs font-bold rounded-xl shadow-lg hover:scale-[1.02] transition-transform">
                <i class="fab fa-whatsapp text-lg"></i> Order Sekarang
            </button>
            <div onclick="toggleSettings()" class="flex items-center justify-between text-sm text-gray-400 hover:text-white cursor-pointer transition-colors pt-2">
                <div class="flex items-center gap-3"><i class="fas fa-cog text-xs"></i><span>Setelan & Bantuan</span></div>
                <div class="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0" id="main-content">
        <header class="p-4 glass-effect border-b border-purple-500/20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="md:hidden w-10 h-10 flex items-center justify-center bg-slate-800 rounded-lg text-purple-400"><i class="fas fa-bars"></i></button>
                <h2 class="font-bold text-sm" id="chat-title">AI Paryds</h2>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6"></div>

        <div class="p-4 bg-slate-900/80 border-t border-white/5 relative">
            <div class="max-w-3xl mx-auto relative">
                <div id="image-preview-overlay" class="preview-container bg-slate-800 p-2 rounded-xl border border-purple-500/50 shadow-2xl">
                    <div class="relative inline-block">
                        <img id="preview-img" src="" class="h-20 w-20 object-cover rounded-lg border border-white/10">
                        <button onclick="cancelUpload()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] shadow-lg"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="document.getElementById('file-input').click()" class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 hover:bg-slate-700 text-purple-400 rounded-xl flex items-center justify-center shrink-0 border border-white/5 transition-colors">
                        <i class="fas fa-image"></i>
                    </button>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImagePreview(this)">
                    <input type="text" id="user-input" placeholder="Ketik pesan atau kirim gambar..." class="flex-1 bg-slate-800 border border-purple-500/30 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all">
                    <button onclick="handleChat()" class="bg-pink-600 hover:bg-pink-500 text-white w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center shrink-0 shadow-lg active:scale-95"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-slate-900 border border-purple-500/30 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl">
            <div class="flex border-b border-white/10">
                <button onclick="switchTab('pengaturan')" id="tab-p" class="flex-1 py-4 text-sm font-bold text-pink-500 border-b-2 border-pink-500 bg-white/5">Pengaturan</button>
                <button onclick="switchTab('bantuan')" id="tab-b" class="flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white">Bantuan & Rating</button>
            </div>
            
            <div id="content-pengaturan" class="p-6 space-y-4">
                <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                    <p class="text-xs text-pink-400 font-bold mb-1 uppercase tracking-widest">Deskripsi Layanan</p>
                    <p class="text-[11px] text-gray-400">AI Paryds: Solusi makalah profesional.</p>
                </div>
                <button onclick="clearAllHistory()" class="w-full py-3 bg-red-500/10 text-red-500 rounded-xl text-xs font-bold border border-red-500/20 active:bg-red-500/20 transition-all">HAPUS RIWAYAT CHAT</button>
            </div>

            <div id="content-bantuan" class="hidden p-6 space-y-4">
                <div class="p-4 bg-white/5 rounded-xl border border-white/5 text-center">
                    <p class="text-xs font-bold text-gray-300 mb-3">Rating Layanan Kami</p>
                    <div class="flex justify-center gap-3 text-2xl">
                        <i class="fas fa-star rating-star" onclick="setRating(1)"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(2)"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(3)"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(4)"></i>
                        <i class="fas fa-star rating-star" onclick="setRating(5)"></i>
                    </div>
                </div>
                <textarea id="complaint-text" placeholder="Tulis masukan..." class="w-full h-24 bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none"></textarea>
                <button onclick="sendComplaint()" class="w-full py-3 bg-pink-600 text-white rounded-xl text-xs font-bold">KIRIM MASUKAN (WA)</button>
            </div>

            <div class="p-4 bg-black/20 flex justify-end border-t border-white/5">
                <button onclick="toggleSettings()" class="px-6 py-2 text-xs font-bold text-gray-500 hover:text-white">TUTUP</button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        let currentChatId = Date.now().toString();
        let allChats = JSON.parse(localStorage.getItem('paryd_chats')) || {};
        let selectedImage = null;

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); }
        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        
        function switchTab(t) {
            const isP = t === 'pengaturan';
            document.getElementById('content-pengaturan').classList.toggle('hidden', !isP);
            document.getElementById('content-bantuan').classList.toggle('hidden', isP);
            document.getElementById('tab-p').className = isP ? 'flex-1 py-4 text-sm font-bold text-pink-500 border-b-2 border-pink-500 bg-white/5' : 'flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white';
            document.getElementById('tab-b').className = !isP ? 'flex-1 py-4 text-sm font-bold text-pink-500 border-b-2 border-pink-500 bg-white/5' : 'flex-1 py-4 text-sm font-bold text-gray-400 hover:text-white';
        }

        function setRating(n) {
            const stars = document.querySelectorAll('.rating-star');
            stars.forEach((s, i) => s.classList.toggle('active', i < n));
            Swal.fire({ icon: 'success', title: 'Terima Kasih!', timer: 1000, showConfirmButton: false, background: '#0f172a', color: '#fff' });
        }

        function handleImagePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedImage = e.target.result;
                    document.getElementById('preview-img').src = selectedImage;
                    document.getElementById('image-preview-overlay').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function cancelUpload() {
            selectedImage = null;
            document.getElementById('file-input').value = "";
            document.getElementById('image-preview-overlay').style.display = 'none';
        }

        async function handleChat() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedImage) return;

            // Inisialisasi chat baru jika belum ada
            if (!allChats[currentChatId]) {
                allChats[currentChatId] = { 
                    title: text.substring(0, 20) || "Chat Gambar", 
                    messages: [{ role: "system", content: "Kamu AI Paryds. Bantu susun makalah profesional." }] 
                };
            }

            // Tampilkan pesan user ke UI
            addMessage(text, 'user', selectedImage);
            
            // Masukkan ke history memori agar AI "sadar" ada gambar
            let promptContent = text;
            if (selectedImage) promptContent = `[USER MENGIRIM GAMBAR]: ${text}`;
            allChats[currentChatId].messages.push({ role: "user", content: promptContent });

            input.value = "";
            cancelUpload(); // Bersihkan preview setelah kirim
            showTyping(true);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: allChats[currentChatId].messages.map(m => ({role: m.role, content: m.content})) 
                    })
                });
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                showTyping(false);
                allChats[currentChatId].messages.push({ role: "assistant", content: aiResponse });
                addMessage(aiResponse, 'ai');
                saveAndRender();
            } catch (err) { showTyping(false); }
        }

        function addMessage(content, sender, image = null) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `flex flex-col ${sender === 'user' ? 'items-end' : 'items-start'}`;
            let imgHTML = image ? `<img src="${image}" class="max-w-[200px] rounded-xl mb-2 shadow-lg">` : '';
            let textHTML = content ? `<div>${sender === 'ai' ? marked.parse(content) : content}</div>` : '';
            div.innerHTML = `<div class="max-w-[85%] p-4 text-sm ${sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai prose prose-invert'}">${imgHTML}${textHTML}</div>`;
            container.appendChild(div);
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function showTyping(show) {
            const container = document.getElementById('chat-container');
            if (show) {
                const div = document.createElement('div'); div.id = 'typing';
                div.innerHTML = `<div class="chat-bubble-ai p-3 flex gap-1 w-16 mb-4"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
                container.appendChild(div);
            } else { const el = document.getElementById('typing'); if(el) el.remove(); }
            container.scrollTop = container.scrollHeight;
        }

        function saveAndRender() { localStorage.setItem('paryd_chats', JSON.stringify(allChats)); renderHistory(); }
        function renderHistory() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            Object.keys(allChats).sort().reverse().forEach(id => {
                const div = document.createElement('div');
                div.className = `p-3 text-xs rounded-xl cursor-pointer flex items-center truncate ${id === currentChatId ? 'active-chat font-bold' : 'text-gray-400 hover:bg-white/5'}`;
                div.onclick = () => { loadChat(id); if(window.innerWidth < 768) toggleMenu(); };
                div.innerHTML = `<i class="far fa-comment-dots mr-2 text-pink-500"></i> ${allChats[id].title}`;
                list.appendChild(div);
            });
        }

        function loadChat(id) { currentChatId = id; document.getElementById('chat-container').innerHTML = ''; if (allChats[id]) allChats[id].messages.filter(m => m.role !== 'system').forEach(m => addMessage(m.content.replace("[USER MENGIRIM GAMBAR]: ", ""), m.role === 'user' ? 'user' : 'ai')); renderHistory(); }
        function createNewChat() { currentChatId = Date.now().toString(); loadChat(currentChatId); }
        function clearAllHistory() { allChats = {}; localStorage.removeItem('paryd_chats'); createNewChat(); saveAndRender(); toggleSettings(); }
        function orderWA() { window.open(`https://wa.me/6289687783535?text=Halo Paryd, mau order makalah!`, '_blank'); }
        function sendComplaint() { const t = document.getElementById('complaint-text').value; if(t) window.open(`https://wa.me/6289687783535?text=Masukan: ${encodeURIComponent(t)}`, '_blank'); }

        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key==='Enter') handleChat(); });
        window.onload = () => { renderHistory(); const ids = Object.keys(allChats).sort().reverse(); ids.length ? loadChat(ids[0]) : createNewChat(); };
    </script>
</body>
</html>
