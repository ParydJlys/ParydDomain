<!DOCTYPE html>
<html lang="id" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Akademik Paryds | Jasjok Makalah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-main: #0b0f1a; --bg-side: #0f172a; --text: #e2e8f0; --glass: rgba(30, 41, 59, 0.7); }
        .light-mode { --bg-main: #f1f5f9; --bg-side: #ffffff; --text: #1e293b; --glass: rgba(255, 255, 255, 0.8); }
        body { background-color: var(--bg-main); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); transition: all 0.3s; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        .glass-effect { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-right: 1px solid rgba(168, 85, 247, 0.1); }
        .active-chat { background: rgba(147, 51, 234, 0.2); border-left: 4px solid #d946ef; }
        .chat-bubble-user { background: linear-gradient(to right, #9333ea, #db2777); color: white; border-radius: 18px 18px 4px 18px; }
        .chat-bubble-ai { background: var(--bg-side); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 18px 18px 18px 4px; }
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 60; }
        @media (max-width: 768px) { 
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); width: 85%; max-width: 300px; } 
            #sidebar.open { transform: translateX(0); }
        }
        .online-indicator { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; position: relative; border: 2px solid var(--bg-main); }
        .online-indicator::after { content: ''; position: absolute; width: 100%; height: 100%; background: inherit; border-radius: inherit; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .typing-dot { width: 5px; height: 5px; background: #d946ef; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="flex">
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 hidden z-50 backdrop-blur-sm"></div>

    <aside id="sidebar" class="glass-effect flex flex-col shrink-0 h-full border-r border-white/5">
        <div class="p-5 border-b border-white/5 flex justify-between items-center">
            <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 italic">ParydDomain</h1>
            <button onclick="toggleMenu()" class="md:hidden text-gray-400 p-2"><i class="fas fa-chevron-left"></i></button>
        </div>
        
        <div class="p-4">
            <button onclick="createNewChat(); if(window.innerWidth < 768) toggleMenu();" class="w-full py-3 px-4 rounded-xl border border-dashed border-purple-500/40 hover:bg-purple-500/10 transition-all flex items-center justify-center gap-2 text-xs font-bold text-white shadow-lg">
                <i class="fas fa-plus-circle"></i> CHAT BARU
            </button>
        </div>

        <div class="px-4 mb-4">
            <p class="text-[9px] uppercase tracking-widest text-pink-500 font-black mb-3 px-1">Kalkulator Order</p>
            <div class="space-y-2">
                <label class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5 active:scale-95 transition-transform cursor-pointer">
                    <span class="text-[11px]">Revisi (10k)</span>
                    <input type="checkbox" value="10000" class="price-checkbox w-4 h-4 accent-pink-500" onchange="updateTotal()">
                </label>
                <label class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5 active:scale-95 transition-transform cursor-pointer">
                    <span class="text-[11px]">Makalah (15k)</span>
                    <input type="checkbox" value="15000" class="price-checkbox w-4 h-4 accent-purple-500" onchange="updateTotal()">
                </label>
            </div>
            <div class="mt-2 bg-gradient-to-r from-purple-900/40 to-pink-900/40 p-3 rounded-xl border border-white/10 flex justify-between items-center">
                <span class="text-[10px] font-bold">ESTIMASI:</span>
                <span id="display-total" class="text-xs font-black text-pink-400">Rp 0</span>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="history-list"></div>

        <div class="p-4 border-t border-white/5 space-y-2">
            <button onclick="orderWA()" class="flex items-center justify-center gap-2 w-full py-3 bg-gradient-to-r from-green-600 to-emerald-500 text-white text-[11px] font-black rounded-xl shadow-xl active:scale-95 transition-all">
                <i class="fab fa-whatsapp text-lg"></i> ORDER VIA WA
            </button>
            <button onclick="toggleSettings()" class="w-full py-2 text-[10px] text-gray-500 hover:text-white flex items-center justify-center gap-2 relative z-[70]">
                <i class="fas fa-cog"></i> Setelan & Bantuan
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#0b0f1a] h-full" id="main-content">
        <header class="p-4 glass-effect border-b border-white/5 flex items-center justify-between sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-xl text-purple-400 active:bg-white/10">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="flex items-center gap-2.5">
                    <div class="relative">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white text-xs"><i class="fas fa-robot"></i></div>
                        <div class="online-indicator absolute -bottom-0.5 -right-0.5"></div>
                    </div>
                    <div>
                        <h2 class="font-bold text-xs" id="chat-title">AI Paryds</h2>
                        <span class="text-[9px] text-green-400 font-medium">Sistem Aktif</span>
                    </div>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            <div class="flex flex-col items-center justify-center h-full text-center opacity-30 px-6 space-y-4 welcome-msg">
                <i class="fas fa-comment-dots text-5xl text-purple-500"></i>
                <p class="text-sm">Tanyakan materi apa saja, AI Paryds siap bantu!</p>
            </div>
        </div>

        <div class="p-3 md:p-6 bg-slate-900/50 backdrop-blur-xl border-t border-white/5">
            <div class="max-w-4xl mx-auto flex items-end gap-2 bg-slate-800/80 p-2 rounded-2xl border border-white/5 shadow-2xl focus-within:border-purple-500/50 transition-all">
                <button onclick="document.getElementById('file-input').click()" class="w-10 h-10 bg-white/5 hover:bg-white/10 text-purple-400 rounded-xl flex items-center justify-center shrink-0 transition-colors">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewImage(this)">
                <textarea id="user-input" rows="1" placeholder="Tanya sesuatu..." class="flex-1 bg-transparent border-none px-2 py-2.5 text-white text-sm focus:outline-none resize-none max-h-32 scrollbar-hide"></textarea>
                <button onclick="handleChat()" class="bg-pink-600 hover:bg-pink-500 text-white w-10 h-10 rounded-xl flex items-center justify-center shrink-0 shadow-lg active:scale-90 transition-all">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
            <p class="text-[8px] text-center text-gray-700 mt-3 font-medium uppercase tracking-[0.3em]">Build by Ahmad Farid Ridho</p>
        </div>
    </main>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-[100] p-4">
        <div class="bg-slate-900 border border-white/10 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-6 space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-black text-pink-500 italic">SETELAN & BANTUAN</h3>
                    <button onclick="toggleSettings()" class="text-gray-500"><i class="fas fa-times"></i></button>
                </div>
                <button onclick="clearAllHistory()" class="w-full py-3 bg-red-500/10 text-red-500 rounded-xl text-[10px] font-bold border border-red-500/20 active:bg-red-500/20 transition-all uppercase tracking-widest">Hapus Semua Riwayat</button>
                <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                    <p class="text-[10px] text-gray-400 leading-relaxed text-center italic">"Solusi cerdas susun makalah profesional."</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        let currentChatId = Date.now().toString();
        let allChats = JSON.parse(localStorage.getItem('paryd_chats')) || {};
        let selectedImage = null;

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function toggleSettings() {
            const m = document.getElementById('modal-settings');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImage = e.target.result;
                    Swal.fire({
                        title: 'Foto Terlampir',
                        imageUrl: selectedImage,
                        imageHeight: 100,
                        timer: 1500,
                        showConfirmButton: false,
                        background: '#0f172a',
                        color: '#fff'
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function handleChat() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedImage) return;

            if (!allChats[currentChatId]) {
                allChats[currentChatId] = { 
                    title: text.substring(0, 20) || "Chat Gambar", 
                    messages: [{ role: "system", content: "Kamu AI Paryds. Bantu susun makalah. Kontak Farid: 089687783535" }] 
                };
            }

            addMessage(text, 'user', selectedImage);
            allChats[currentChatId].messages.push({ role: "user", content: text, image: selectedImage });
            
            input.value = "";
            selectedImage = null;
            showTyping(true);

            try {
                const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: allChats[currentChatId].messages.map(m => ({role: m.role, content: m.content})) 
                    })
                });
                const d = await r.json();
                const res = d.choices[0].message.content;
                showTyping(false);
                allChats[currentChatId].messages.push({ role: "assistant", content: res });
                addMessage(res, 'ai');
                saveAndRender();
            } catch (e) { showTyping(false); }
        }

        function addMessage(c, s, i = null) {
            const container = document.getElementById('chat-container');
            const welcome = container.querySelector('.welcome-msg');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `flex flex-col ${s === 'user' ? 'items-end' : 'items-start'} mb-4`;
            let img = i ? `<img src="${i}" class="max-w-[180px] rounded-xl mb-2 border border-white/10 shadow-lg">` : '';
            let txt = c ? `<div class="${s === 'ai' ? 'prose prose-invert prose-sm' : ''}">${s === 'ai' ? marked.parse(c) : c}</div>` : '';
            div.innerHTML = `<div class="max-w-[85%] p-3.5 text-[13px] ${s === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'}">${img}${txt}</div>`;
            container.appendChild(div);
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function showTyping(s) {
            const c = document.getElementById('chat-container');
            if (s) {
                const d = document.createElement('div'); d.id = 'typing';
                d.innerHTML = `<div class="chat-bubble-ai p-3 flex gap-1 w-16 mb-4"><span class="typing-dot"></span><span class="typing-dot" style="animation-delay:0.2s"></span><span class="typing-dot" style="animation-delay:0.4s"></span></div>`;
                c.appendChild(d);
            } else { const e = document.getElementById('typing'); if(e) e.remove(); }
            c.scrollTop = c.scrollHeight;
        }

        function updateTotal() {
            let t = 0; document.querySelectorAll('.price-checkbox:checked').forEach(c => t += parseInt(c.value));
            document.getElementById('display-total').innerText = "Rp " + t.toLocaleString('id-ID');
        }

        function orderWA() { window.open(`https://wa.me/6289687783535?text=Halo Paryd, mau order joki makalah.`, '_blank'); }
        function saveAndRender() { localStorage.setItem('paryd_chats', JSON.stringify(allChats)); renderHistory(); }
        function renderHistory() {
            const l = document.getElementById('history-list'); l.innerHTML = '';
            Object.keys(allChats).sort().reverse().forEach(id => {
                const d = document.createElement('div');
                d.className = `p-3 text-[11px] rounded-xl cursor-pointer flex items-center justify-between ${id === currentChatId ? 'active-chat font-bold text-white' : 'text-gray-400 hover:bg-white/5'}`;
                d.onclick = () => { currentChatId = id; loadChat(id); if(window.innerWidth < 768) toggleMenu(); };
                d.innerHTML = `<span class="truncate"><i class="far fa-comment text-pink-500 mr-2"></i>${allChats[id].title}</span>`;
                l.appendChild(d);
            });
        }

        function loadChat(id) {
            const c = document.getElementById('chat-container'); c.innerHTML = '';
            if (allChats[id]) allChats[id].messages.filter(m => m.role !== 'system').forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'ai', m.image));
            renderHistory();
        }

        function createNewChat() { currentChatId = Date.now().toString(); loadChat(currentChatId); }
        function clearAllHistory() { allChats = {}; localStorage.removeItem('paryd_chats'); createNewChat(); saveAndRender(); toggleSettings(); }
        window.onload = () => { renderHistory(); const ids = Object.keys(allChats).sort().reverse(); ids.length ? loadChat(ids[0]) : createNewChat(); };
    </script>
</body>
</html>
